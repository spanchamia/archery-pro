<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fae">
  <title>Archery Pro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🎯 Archery Pro</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="practice" aria-selected="true">Practice</button>
      <button class="tab" role="tab" data-view="history" aria-selected="false">Progress</button>
    </nav>
  </header>

  <main>
    <!-- Practice: start a session, or score the active one -->
    <section id="view-practice" class="view">
      <form id="start-form" class="card" hidden>
        <h2>New practice session</h2>
        <label>Date
          <input type="date" name="date" required>
        </label>
        <label>Arrows per end
          <select name="arrowsPerEnd">
            <option value="3" selected>3</option>
            <option value="6">6</option>
          </select>
        </label>
        <label>Notes <span class="muted">(optional)</span>
          <input type="text" name="notes" placeholder="e.g. 18m, 40cm triple spot" maxlength="80">
        </label>
        <button type="submit" class="primary">Start session</button>
      </form>

      <div id="active-session" hidden>
        <div class="card session-head">
          <div>
            <h2 id="session-title"></h2>
            <p id="session-notes" class="muted"></p>
          </div>
          <button id="finish-btn" class="secondary">Finish</button>
        </div>

        <div class="stats" id="live-stats"></div>

        <div class="card">
          <div class="end-label">
            <span id="end-number"></span>
            <span id="end-running" class="muted"></span>
          </div>
          <div id="current-end" class="slots"></div>
          <div id="keypad" class="keypad"></div>
          <div class="keypad-actions">
            <button id="undo-btn" class="secondary">↶ Undo</button>
          </div>
        </div>

        <div class="card">
          <h3>Ends</h3>
          <table class="ends-table">
            <thead><tr><th>#</th><th>Arrows</th><th>End</th><th>Total</th><th></th></tr></thead>
            <tbody id="ends-body"></tbody>
          </table>
          <p id="ends-empty" class="empty">Tap the keypad to score your first end.</p>
        </div>
      </div>
    </section>

    <!-- History: chart across sessions + session list -->
    <section id="view-history" class="view" hidden>
      <div class="stats" id="overall-stats"></div>

      <div class="card">
        <h2>Average arrow score per session</h2>
        <div id="chart" class="chart"></div>
      </div>

      <div class="card">
        <h2>Sessions</h2>
        <ul id="session-list" class="session-list"></ul>
        <p id="sessions-empty" class="empty">No sessions yet.</p>
      </div>

      <div class="card data-tools">
        <h3>Your data</h3>
        <p class="muted">Data is saved in this browser only. Export a backup to keep it safe or move it to another device.</p>
        <div class="row">
          <button id="export-btn" class="secondary">Export backup</button>
          <label class="button secondary">Import backup
            <input id="import-input" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
